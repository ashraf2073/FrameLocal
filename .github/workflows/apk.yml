name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Unpack FrameLocal.zip if the project folders are missing
        run: |
          if [ ! -f www/index.html ]; then
            ZIP=$(ls ./*.zip 2>/dev/null | head -n 1 || true)
            if [ -z "$ZIP" ]; then
              echo "::error::www/index.html is missing. Upload the FrameLocal files, or FrameLocal.zip, to the repository root."
              exit 1
            fi
            echo "www/ is missing, unpacking $ZIP"
            rm -rf /tmp/unpacked && mkdir -p /tmp/unpacked
            unzip -qo "$ZIP" -d /tmp/unpacked
            SRC=$(dirname "$(find /tmp/unpacked -name capacitor.config.json | head -n 1)")
            (cd "$SRC" && tar cf - .) | tar xf - --skip-old-files
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Add the Android project (first run only)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate launcher icons and splash screens
        run: npm run icons

      - name: Allow the camera
        run: node scripts/patch-android.mjs

      - name: Copy the web app into Android
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameLocal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
